# Optional explicit per-launch overlay; never installed into global OMP settings.
# CLI probe observed OMP 19.1.1 on Linux. Validate these optional config keys in the actual host before relying on them.
# The host's limits, permissions, and policy still apply. No model IDs or credentials are included.
goal:
  enabled: true
task:
  batch: true
  maxConcurrency: 4
  isolation:
    enabled: true
    apply: false
    merge: patch
# Capture independent patches; the coordinator reviews and integrates them serially.
# Omit the overlay when the installed OMP version does not support these settings.
